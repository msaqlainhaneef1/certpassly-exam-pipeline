[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "certpassly-exam-pipeline"
version = "1.2.0"
description = "Scripts-first pipeline that builds CertPassly exam pages and question import files from official vendor sources and owner PDFs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "CertPassly"}]
# Python deps for image-question analysis (extract stage). System tools are listed in README.
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "Pillow>=10.0",
]

[project.optional-dependencies]
# Render JavaScript-built official pages (fetch_sources.py falls back to it). Then run:
#   python -m playwright install chromium
render = ["playwright>=1.40"]

[project.scripts]
certpassly-pipeline = "certpassly_pipeline.run_pipeline:main"

[tool.setuptools]
packages = ["certpassly_pipeline", "certpassly_pipeline.adapters"]
include-package-data = true

[tool.setuptools.package-dir]
certpassly_pipeline = "scripts"
