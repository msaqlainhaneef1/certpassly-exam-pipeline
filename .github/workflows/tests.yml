name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: System tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr

      - name: System tools (Windows)
        if: runner.os == 'Windows'
        run: choco install poppler tesseract -y --no-progress

      - name: Install package
        run: python -m pip install -e .

      - name: CLI smoke test
        run: |
          certpassly-pipeline --help
          certpassly-pipeline --list-stages

      - name: Offline tests
        run: python -m unittest discover -s tests -v
